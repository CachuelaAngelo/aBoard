<div class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center p-4">
  <!-- Login Card -->
  <div class="bg-white rounded-lg shadow-2xl w-full max-w-md p-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">aBoard</h1>
      <p class="text-gray-600">Sign in to your account</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Email Input -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Email Address
        </label>
        <input 
          id="email"
          type="email" 
          formControlName="email"
          placeholder="you@example.com"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
        >
      </div>

      <!-- Password Input -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
          Password
        </label>
        <input 
          id="password"
          type="password" 
          formControlName="password"
          placeholder="Enter your password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
        >
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2">
          <input 
            type="checkbox" 
            formControlName="rememberMe"
            class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
          >
          <span class="text-gray-700">Remember me</span>
        </label>
        <a href="#" class="text-indigo-600 hover:text-indigo-500 font-medium">
          Forgot password?
        </a>
      </div>

      <!-- Submit Button -->
      <button 
        routerLink="/profile"
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200"
      >
        Sign In
      </button>
    </form>

    <!-- Divider -->
    <div class="my-6 flex items-center gap-3">
      <div class="flex-1 border-t border-gray-300"></div>
      <span class="text-gray-500 text-sm">or</span>
      <div class="flex-1 border-t border-gray-300"></div>
    </div>

    <!-- Social Login (Optional) -->
    <div class="flex justify-center gap-3 mb-6">
      <button class="border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2 px-4 rounded-lg transition flex items-center justify-center gap-2">
        Google
      </button>
    </div>

    <!-- Sign Up Link -->
    <p class="text-center text-gray-600">
      Don't have an account? 
      <a routerLink="/sign-up" class="text-indigo-600 hover:text-indigo-500 font-semibold">
        Sign up
      </a>
    </p>
  </div>
</div>
